name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Warnings are reported but do not fail the run until main is clean
      # of them (see the clippy cleanup issue); errors still do.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # Every crate's tests, even after one fails. victory-gpu's without a
      # GPU device: the runners have none, and WARP crashes in its tests
      # (#39).
      - name: Tests
        env:
          VICTORY_NO_GPU: "1"
        run: cargo test --workspace --exclude victory-shader --locked --no-fail-fast
      # The shader tests need a device and take WARP's; one at a time, so a
      # crash names its test (#39).
      - name: Tests, shader translator
        if: success() || failure()
        run: cargo test -p victory-shader --locked -- --test-threads=1
