# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's reviews. Its approval, with passing CI, merges a pull request
# (.github/workflows/automerge.yml).
language: en-US
# One review, then only checks that its comments were addressed (see the
# instructions under path_instructions).
tone_instructions: >-
  Be brief. In a follow-up review, post no new comments: only resolve the
  earlier ones the new commits address, unless they add a critical bug or a
  security problem.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  # One summary comment, kept short; no status or info messages.
  review_status: false
  review_info: false
  review_details: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  changed_files_summary: false
  # One review when a pull request opens. After pushing fixes the author asks
  # for a follow-up with `@coderabbitai review`: it looks only at the new
  # commits, resolves the threads they fix, and then approves.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  path_filters:
    - "!Cargo.lock"
  auto_approvals:
    enabled: true
    # The author may not approve their own pull request by command.
    allow_author_approval: false
    max_merge_risk: high
    overrides:
      # Always the maintainer's: CI, the policy check, build config,
      # dependencies, tools/ and this file. Renames match both paths.
      - enabled: false
        paths:
          - ".github/**"
          - ".coderabbit.yaml"
          - ".githooks/**"
          - ".cargo/**"
          - "xtask/**"
          - "tools/**"
          - "setup.sh"
          - "rust-toolchain.toml"
          - "**/Cargo.toml"
          - "Cargo.toml"
          - "Cargo.lock"
  merge_risk_instructions: >-
    Docs and test-only changes are minimal risk. Changes to the shader
    translator (crates/victory-shader), the GPU layer (crates/victory-gpu),
    the PE loader's code patching (crates/victory-loader) or lock-free tables
    are at least moderate: they can silently drop draws, views or copies, or
    alias stale data. Anything that weakens the asset policy is critical.
  path_instructions:
    - path: "**"
      instructions: |
        Review a pull request once, when it opens: everything worth saying goes in that review. A follow-up review (of commits pushed after it) only checks whether the earlier comments were addressed. Resolve the ones that were, and approve when none is left. Post no new comments in a follow-up, not even minor ones, unless the new commits add a critical bug or a security problem.
        VIctory for macOS runs Xbox Series applications on Apple Silicon Macs through Wine, Rosetta 2 and D3DMetal. Review for correctness first: wrong GPU state, data races in lock-free code, unsound unsafe blocks, x86 instruction encoding, and changes that silently drop work (draws, views, copies) or alias stale data. Performance claims should come with numbers from matched runs.
        - Nothing from the application is ever committed. That means no executables, DLLs, shaders, textures, audio, keys, dumps, decrypted files or screenshots of application content. It also covers hex or base64 blobs inside text files. `cargo xtask policy` enforces this with a file-name allowlist. Flag any change that adds such data or widens the allowlist or its `EXCEPTIONS`.
        - Nothing from Apple's Game Porting Toolkit (D3DMetal and the like) may be committed.
        - Every `unsafe` block needs a `// SAFETY:` comment that says why it is sound.
        - Behaviour changes need a test. GPU and shader behaviour is best tested under Wine with D3DMetal; Windows-only tests skip themselves without a device.
        - A deliberate simplification is marked with a `shortcut:` comment. Removing one should implement what it describes, not just delete the comment.
        - Lock-free tables that reuse slots must not let an old record resolve to a new entry: check generation widths and wraparound.
        - A feature that depends on host support (for example D3D12 options) needs a fallback when the host reports it unsupported.
        - Commit subjects are short and say what changed, such as `fix(gpu): keep the clamp's budget per list`.
chat:
  # Replies only when someone mentions @coderabbitai.
  auto_reply: false
